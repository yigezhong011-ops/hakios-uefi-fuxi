name: build fuxi uefi

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  uefi:
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Python deps
        run: python3 -m pip install -r pip-requirements.txt
      - name: Build
        run: |
          python3 build_uefi.py -d fuxi -r RELEASE 2>&1 | tail -60
      - name: Collect
        if: always()
        run: |
          mkdir -p out
          find Build -name 'SILICIUM_UEFI.fd' -exec cp {} out/ \; 2>/dev/null || true
          find Build -name '*.fd' -exec cp {} out/ \; 2>/dev/null || true
          ls -l out || true
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuxi-uefi
          path: out/
          if-no-files-found: warn
          retention-days: 7
